<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign in - Alarm</title>
<link rel="icon" href="/ui/assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui/assets/app.css">
</head>
<body>
<main class="page login">
  <h1>Alarm</h1>
  <form class="card" method="post" action="/login">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required autofocus value="{{username}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="64" required>
    <p class="error" role="alert">{{error}}</p>
    <button type="submit" class="primary">Sign in</button>
  </form>
</main>
<footer class="foot"><span>{{build}}</span></footer>
</body>
</html>
