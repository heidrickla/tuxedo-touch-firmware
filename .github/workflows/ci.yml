name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same script the pre-push hook and the Gitea runner use. Every check in
  # it corresponds to a failure that actually happened here, several of them
  # costing a flash, so this is the job that matters.
  regression:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # check_attribution reads the whole history, not HEAD

      - name: install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy binutils-arm-linux-gnueabi

      - name: run checks
        run: bash ci/checks.sh

  # tuxweb is the Barracuda replacement; its tests pin the wire format the
  # panel's own consumers depend on, including the vendor's RFC 2046 violation.
  tuxweb:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: tuxweb
    steps:
      - uses: actions/checkout@v5

      - name: toolchain (pinned)
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1

      # the crate registry and dependency builds, kept between runs keyed on the toolchain and Cargo.lock
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tuxweb -> target
          cache-bin: "false"

      # A release binary checked against its published digest, not a build on every push.
      - name: cargo-deny (pinned)
        run: |
          v=0.20.2
          d=cargo-deny-$v-x86_64-unknown-linux-musl
          curl -sSfL -o "$d.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/$d.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $d.tar.gz" | sha256sum -c -
          tar -xzf "$d.tar.gz" --strip-components=1 -C "$HOME/.cargo/bin" "$d/cargo-deny"

      - name: cargo-nextest (pinned)
        run: |
          n=cargo-nextest-0.9.146-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$n" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/$n"
          echo "b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa  $n" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest" && tar -xzf "$n" -C "$RUNNER_TEMP/nextest"
          install -m 755 "$(find "$RUNNER_TEMP/nextest" -type f -name cargo-nextest)" "$HOME/.cargo/bin/"
          cargo nextest --version

      - name: format
        run: cargo fmt --check

      - name: lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        run: cargo nextest run --locked --all-targets

      - name: dependencies
        run: cargo deny check

      - name: build
        run: cargo build --locked --release

      # Cross-compilation is what actually ships, and it has its own failure
      # mode: ring needs a C cross-compiler, and cc-rs looks for one that does
      # not exist on Ubuntu. Building it here means BUILD.md's recipe is tested
      # rather than remembered.
      - name: cross-build for the panel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabi
          rustup target add arm-unknown-linux-musleabi
          cargo build --locked --release --target arm-unknown-linux-musleabi
        env:
          CC_arm_unknown_linux_musleabi: arm-linux-gnueabi-gcc
          AR_arm_unknown_linux_musleabi: arm-linux-gnueabi-ar

      - name: the shipped binary is a static ARM executable
        run: |
          f=target/arm-unknown-linux-musleabi/release/tuxweb
          file "$f"
          file "$f" | grep -q "ARM" || { echo "not an ARM binary"; exit 1; }
          file "$f" | grep -q "statically linked" || {
            echo "not static -- the panel has glibc 2.5 and will not load it"; exit 1; }
